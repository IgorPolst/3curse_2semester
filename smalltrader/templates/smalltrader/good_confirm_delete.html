{% extends "config/base.html" %}
{% load static %}

{% block title %}Удалить товар{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-danger">
                <div class="card-body p-4 text-center">
                    <h2 class="text-danger mb-4">
                        <i class="fas fa-exclamation-triangle"></i> Удаление товара
                    </h2>
                    
                    <p class="lead">
                        Вы уверены, что хотите удалить товар
                        <strong>«{{ good.title }}»</strong>?
                    </p>
                    
                    <p class="text-muted small">
                        Это действие <strong>нельзя отменить</strong>.
                    </p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-danger btn-lg">
                                <i class="fas fa-trash"></i> Да, удалить
                            </button>
                            <a href="{% url 'good_detail' good.id %}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left"></i> Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
